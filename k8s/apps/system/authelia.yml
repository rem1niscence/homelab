apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authelia
  namespace: argocd
  labels:
    type: system
spec:
  project: default
  sources:
    - repoURL: https://charts.authelia.com
      chart: authelia
      targetRevision: 0.11.22
      helm:
        valueFiles:
          - $repo/k8s/values/system/authelia/values.yml
    - repoURL: git@github.com:rem1niscence/homelab.git
      targetRevision: deploy
      ref: repo
    - repoURL: git@github.com:rem1niscence/homelab.git
      targetRevision: deploy
      path: k8s/values/system/authelia/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: authelia
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
