apiVersion: apps/v1
kind: Deployment
metadata:
  name: dayglance
  labels:
    app: dayglance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dayglance
  template:
    metadata:
      labels:
        app: dayglance
    spec:
      nodeSelector:
        platform.io/type: pi
      containers:
        - name: dayglance
          image: ghcr.io/krelltunez/dayglance:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          env:
            - name: TZ
              value: "Etc/UTC"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dayglance
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: dayglance
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dayglance
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dayglance.remini.site`)
      kind: Rule
      services:
        - name: dayglance
          port: 80
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: dayglance
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: "dayglance"
      images:
        - alias: dayglance
          imageName: ghcr.io/krelltunez/dayglance:latest
          commonUpdateSettings:
            updateStrategy: "digest"
