apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      nodeSelector:
        platform.io/pi: pi-3
      containers:
        - name: front
          image: tombursch/kitchenowl-web:latest
          ports:
            - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: back
spec:
  replicas: 1
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      nodeSelector:
        platform.io/type: main
      containers:
        - name: back
          image: tombursch/kitchenowl:latest
          ports:
            - containerPort: 5000
          env:
            - name: FRONT_URL
              value: https://kitchenowl.remini.site
            - name: OIDC_ISSUER
              value: https://auth.remini.site
            - name: OIDC_CLIENT_ID
              value: kitchenowl
            - name: UWSGI_BUFFER_SIZE
              value: "32768"
          envFrom:
            - secretRef:
                name: kitchenowl
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1G
  storageClassName: longhorn
---
apiVersion: v1
kind: Service
metadata:
  name: front

spec:
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: back

spec:
  selector:
    app: back
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kitchenowl

spec:
  entryPoints:
    - websecure
  routes:
    - match: Host("kitchenowl.remini.site")
      kind: Rule
      services:
        - name: front
          port: 80
---
apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: kitchenowl
  namespace: argocd
spec:
  applicationRefs:
    - namePattern: "kitchenowl"
      images:
        - alias: front
          imageName: tombursch/kitchenowl-web:latest
          commonUpdateSettings:
            updateStrategy: "digest"
        - alias: back
          imageName: tombursch/kitchenowl-web:latest
          commonUpdateSettings:
            updateStrategy: "digest"
